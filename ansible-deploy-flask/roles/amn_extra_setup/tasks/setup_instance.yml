---
- name: make instance directory
  become: yes
  file:
    path: "{{ app_src_dir }}/instance"
    state: directory
    owner: "{{ uid }}"
    group: "{{ gid }}"

- name: create custom settings.py in instance directory
  become: yes
  template:
    src: templates/settings.py.j2
    dest: "{{ app_src_dir }}/instance/settings.py"
    owner: "{{ uid }}"
    group: "{{ gid }}"
